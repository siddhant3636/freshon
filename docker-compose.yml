services:
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshon-backend1
    env_file:
      - ./backend/.env
    expose:
      - "4000"
    restart: unless-stopped

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshon-backend2
    env_file:
      - ./backend/.env
    expose:
      - "4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freshon-frontend
    expose:
      - "80"
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: freshon-admin
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: freshon-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
      - frontend
      - admin
    restart: unless-stopped